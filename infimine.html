<body>
<div id="infimine"></div>
<script type="module">
'use strict';

let game = {};
let mainProps = {};
const ui = { showConf: false, markOnClick: false }; // UI state - kept out of the model, merged into the save for compatibility
let rng = Math.random; //random source used for bombs - injectable for deterministic tests/seeds
let newBest = { score: false, time: false }; //set when the last result beat the records - shown in the END line

/* storage keys - single source of truth; the exact strings must stay unchanged for compatibility */
const STORAGE_KEY_GAME = 'game';
const STORAGE_KEY_LAST_GAME = 'lastGame';
const STORAGE_KEY_FAVORITES = 'favoriteGames';
const STORAGE_KEY_BEST_SCORE_PREFIX = 'bestScoreList_';

function setRandom(f) {
	rng = (typeof f === 'function') ? f : Math.random;
}

function Cell(props={}) {
	
	const isOpen = props['isOpen']===true?true:false;
	const hasBomb = props['hasBomb']!==undefined?props['hasBomb']:(rng()<getBombDensity());
	const bombCount = props['bombCount'];
	
	return {
		'isOpen': isOpen,
		'hasBomb': hasBomb,
		'bombCount': bombCount,
		'hasMark': false
	}
}

function initDefinition() {
	const defaultLives = 3;
	/* game definition */
	const g = {
		bombDensity: (mainProps['bombDensity']!==undefined)?mainProps['bombDensity']:0.2063, //(() => { return 0.2063; }),//0.2063, //0.1563; 1/8.; //1/16.;
		canOpenNeighbours: (mainProps['canOpenNeighbours']===false)?false:true,  //bool
		defaultLives: (mainProps['defaultLives']!==undefined && mainProps['defaultLives']>0)?mainProps['defaultLives']:defaultLives, //null -> infinite - int
		spaceSize: (mainProps['spaceSize']!==undefined)?mainProps['spaceSize']:[16,16], //[16,20,5], //() => { return [16,20]},  //[16,30], //[5,7], //[8,6], //[[0,8],[0,6]],  //[5,-1]   //>0 - bounded; <0 - cyclic; 0/null - unbounded - array or func
		fixedBombs: (mainProps['fixedBombs']!==undefined && mainProps['fixedBombs']>0)?mainProps['fixedBombs']:null, //null, //fixed number of bombs - int>0
		
	}

	return g;
}

function initValues() {
	const viewSize = game.spaceSize.slice(0,2).map(x => x!=0?(Math.abs(x)+2):16); //[18,18]; //[5,4], //[16, 30], //16/16  8/8    10/8 
	if (viewSize[0]>25) viewSize[0] = 25;
	if (viewSize[1]>45) viewSize[1] = 45;

	const viewCenter = initViewCenter(viewSize);
	const currDimCoord = game.spaceSize.map(x => 0);
	/* game values */
	const g = {
		field: {},
		viewSize: (mainProps['viewSize']!==undefined)?mainProps['viewSize']:viewSize,
		viewCenter: (mainProps['viewCenter']!==undefined)?mainProps['viewCenter']:viewCenter,
		viewDim: [0,1], //check?
		currDimCoord: currDimCoord, 

		inGame: 0,
		lives: game?game.defaultLives:null, //null
		clickCount: 0,
		//timer - the clock is derived from timestamps, it is never incremented by ticks
		timeElapsed: 0,      //ms accumulated outside the running segment
		timeRunningSince: 0, //epoch ms of the current running segment (0 = not running)
		timePaused: false,
		timeStarted: false,
	}
	return g;
}

/* timer - start on the first click, pauseable, frozen at game end, kept in the save */
function formatTime(ms) {
	const t = Math.max(0, Math.floor(ms/1000));
	let h = Math.floor(t/3600);
	const m = Math.floor((t%3600)/60);
	let s = t%60;
	const p = n => (n<10?'0':'')+n;
	return (h>0)?(h+':'+p(m)+':'+p(s)):(m+':'+p(s));
}

function timerRunning() {
	return (game.timeStarted===true && game.timePaused!==true && game.inGame!==2 && game.timeRunningSince>0);
}

function getElapsed() {
	return (game.timeElapsed||0) + (timerRunning()?(Date.now() - game.timeRunningSince):0);
}

function timerStart() { //called from clickCell - the clock measures real play only (1a)
	if (game.timeStarted===true) return;
	game.timeStarted = true;
	game.timeRunningSince = Date.now();
}

function timerFold() { //materialize the running segment (before serializing a save)
	if (timerRunning()) {
		game.timeElapsed += Date.now() - game.timeRunningSince;
		game.timeRunningSince = Date.now();
	}
}

function timerFreeze() { //game over - lock the final time (must not check inGame: it is already 2 when called)
	if (game.timeStarted===true && game.timeRunningSince>0) {
		game.timeElapsed += Date.now() - game.timeRunningSince;
	}
	game.timeRunningSince = 0;
}

function timerNormalize() { //after load: continue from the stored value, time away from the game does not count (3a)
	game.timeElapsed = (typeof game.timeElapsed==='number' && game.timeElapsed>0)?game.timeElapsed:0;
	game.timePaused = (game.timePaused===true);
	game.timeStarted = (game.timeStarted===true);
	if (game.timeStarted && game.timePaused!==true && game.inGame!==2) {
		game.timeRunningSince = Date.now(); //restart the segment now - no offline time
	} else {
		game.timeRunningSince = 0;
	}
}

function timerToggle() {
	if (game.inGame===2 || game.timeStarted!==true) return; //nothing to pause before the first click / after the end
	if (game.timePaused===true) {
		game.timePaused = false;
		game.timeRunningSince = Date.now();
	} else {
		timerFold();
		game.timePaused = true;
		game.timeRunningSince = 0;
	}
	updateView();
}

let tickerId = null;
function startTicker() { //refresh only the time label, never the whole view
	if (tickerId!==null) return;
	tickerId = setInterval(function() {
		const el = document.getElementById('gameTime');
		if (el) el.textContent = formatTime(getElapsed());
	}, 1000);
}

function getKeyFromStrKey(sk) {
	return game.viewDim.map(i => sk.split('|').map(Number)[i]);
}
function getStrKeyFromKey(k) {
	const kr = game.currDimCoord.map((v,i) => game.viewDim.find(j => j===i)>=0?k[game.viewDim.findIndex(j => j===i)]:v);
	const kn = normalizeCoordinates(kr);
	if (kn===null) return null;
	return kn.reduce((p,n)=>p+'|'+n);
}

function normalizeCoordinates(p) {
	const currSpaceSize = game.spaceSize;
	const out = p.slice(); //pure: never modify the caller's array
	for (let i in out) {
		if (currSpaceSize[i]>0) {
			//bounded
			if (out[i]<0) return null;
			if (out[i]>=currSpaceSize[i]) return null;
		} else if (currSpaceSize[i]<0) {
			//cyclic
			out[i] =  ((out[i] % currSpaceSize[i]) + currSpaceSize[i]) % currSpaceSize[i];
		}
		// else (0, null) -> infinite
	}
	return out;
}

function getCell(sk, canBomb=true) {
	let props = {};
	if (!canBomb) props['hasBomb'] = false;
	if (!(sk in game.field)) { game.field[sk] = Cell(props) };

	return game.field[sk];
}

/* field helpers - every predicate over game.field lives here */
function allCellKeys() { return Object.keys(game.field); }
function keysWhere(pred) { return allCellKeys().filter(k => pred(game.field[k])); }
function countWhere(pred) { return keysWhere(pred).length; }

const cellHasBomb = c => c['hasBomb']===true;
const cellIsOpen = c => c['isOpen']===true;
const cellIsOpenBomb = c => c['isOpen']===true && c['hasBomb']===true;
const cellIsMarked = c => c['hasMark']===true;
const cellIsMarkedBomb = c => c['hasMark']===true && c['hasBomb']===true;
//closed and still counting for the win condition (unmarked, or marked without a bomb)
const cellIsOpenable = c => c['isOpen']===false && (c['hasMark']===false || (c['hasMark']===true && c['hasBomb']===false));
const cellIsSeen = c => c['isOpen']===true || c['hasMark']===true;

function getResult() {
	if (!game) return null;
	const bo = countWhere(cellIsOpenBomb);
	const m = countWhere(cellIsMarked);
	const mp = countWhere(cellIsMarkedBomb);
	const ccr = (m>0 && mp>0 && game.clickCount>0)?(game.clickCount/mp):Number.MAX_SAFE_INTEGER; //click count
	
	const lr = ((game.defaultLives>0)?(game.defaultLives-game.lives):0) + 1;
	
	const sc = (1000*ccr*Math.sqrt(lr*(bo+1))).toFixed(0);

	return {score:sc, bombs:bo, marks:m, time:getElapsed()}; //lower is better: fewer clicks per flag, fewer lives lost, fewer bombs hit
}

function getBombDensity() {
	//pure read: derives density from the current state, does not touch it
	let dens = game.bombDensity;
	if (game.fixedBombs>0 && game.spaceSize.filter(x => x===null || x===0).length===0) {
		let s = Math.abs(game.spaceSize.reduce((x,y)=>(x*y)) - allCellKeys().length);
		if (s>0) {
			let b = game.fixedBombs - countWhere(cellHasBomb);
			b = b>game.fixedBombs?game.fixedBombs:(b<0?0:b); //normalize
			dens = b/s;
			dens = dens>1?1:(dens<0?0:dens);
		} else {
			dens = 0; //no place left
		}
	}
	return dens;
}

function initViewCenter(viewSize) {
	const viewDim = game.hasOwnProperty('viewDim')?game.viewDim:[0,1];
	return [parseInt(game.spaceSize[viewDim[0]]/2) - parseInt(viewSize[viewDim[0]]/2), parseInt(game.spaceSize[viewDim[1]]/2) - parseInt(viewSize[viewDim[1]]/2)]; //[0,0];
}

function getNeighbours(sk) {
	let n = [];
	const selViewCell = getKeyFromStrKey(sk); //from view
	const selCell = game.currDimCoord.slice(); //pure: work on a copy, do not move the cursor
	selCell[game.viewDim[0]] = selViewCell[0];
	selCell[game.viewDim[1]] = selViewCell[1];
	
	const tmp = [];
	let N = selCell.length;
	while (N--) tmp.push([-1,0,1]);
	const ndc = tmp.reduce((a, b) => a.reduce((r, v) => r.concat(b.map(w => [].concat(v, w))), []));
			
	for (let e of ndc) {
		const nc = selCell.map((s,i) => s + e[i]);
		let k = getStrKeyFromKey(nc);
		if (k==sk) continue;
		if (k!==null) { n.push(k); }
	}
	
	return n;
}

function getCellBombCount(sk) {
	let sumPoints = 0;
	for (const nk of getNeighbours(sk)) {
		const p = getCell(nk,game.inGame!==0);
		if ('hasBomb' in p && p['hasBomb']===true) sumPoints += 1;
	}
	return sumPoints;
}

function findCellCenterView() {
	let k = keysWhere(cellIsOpenable);

	if (k.length<=0) {
		k = keysWhere(cellIsSeen);
	}

	if (k.length>0) {
		const fe = k.sort().shift();
		const centerCell = getKeyFromStrKey(fe);
		game.viewCenter = [centerCell[0] - parseInt(game.viewSize[0]/2), centerCell[1] - parseInt(game.viewSize[1]/2)]
		updateView();	
	}
}

function openCell(sk) {
	const o = getCell(sk, game.inGame!==0);

	if (game.canOpenNeighbours===true && o['isOpen']===true && o['hasBomb']===false && o['bombCount']>=0) {
		let c = 0;
		const toOpen = [];
		for (const nk of getNeighbours(sk)) {
			const p = getCell(nk);
			if ((p['isOpen']===true && p['hasBomb']===true) || p['hasMark']===true) c += 1;
			if (p['isOpen']===false && p['hasMark']===false) toOpen.push(nk);
		}
		if (c===o['bombCount']) {
			for (const nk of toOpen) {
				openCell(nk);
			}
		}
	}

	if (o['isOpen']===false && o['hasMark']===false) {
		o['bombCount'] = getCellBombCount(sk);
		if (game.inGame===0) {
			game.inGame = 1;
		}
		o['isOpen'] = true;
		game.field[sk] = o;
		
		//neighbours
		if (game.canOpenNeighbours===true && o['bombCount']===0) {
			for (const nk of getNeighbours(sk)) {
				openCell(nk);
			}
		}
	}
	return o;
}

function changeMarkCell(sk) {
	const o = getCell(sk, game.inGame!==0);
	if (o['isOpen']===false) {
		o['hasMark'] = !o['hasMark'];
		game.field[sk] = o;
	}
}

function changeDim(d) {
	if (!([0,1].includes(d))) return;
	const o = game.viewDim[d];
	for (let i=1;i<game.spaceSize.length;i++) {
		let n = (o + i)%game.spaceSize.length;
		if (n==o) break;
		if (n==game.viewDim[(d + 1)%2]) continue;
		game.viewDim[d] = n;
		updateView();
		break;
	}
}

function moveInDim(d) {
	if (d>=0 && d<game.currDimCoord.length) {
		game.currDimCoord[d] = (game.currDimCoord[d] + 1)%(game.spaceSize[d]);
		updateView();
	}
}


function buildView() {
	//ended -> flat gray (noplay); paused -> gray plus visibly quiet cells, a click on the field resumes
	let s = '<table class="minefield '+((game.inGame===2)?'noplay':((game.timePaused===true)?'paused':''))+'">';
	for (const r of [...Array(game.viewSize[0]).keys()].map(x => x + game.viewCenter[0])) {
		s += '<tr>';
		for (let c of [...Array(game.viewSize[1]).keys()].map(x => x + game.viewCenter[1])) {
			const sk = getStrKeyFromKey([r,c]);
			let vd = '';
			let cls = 'shadow';
			let act = (sk===null || game.inGame===2)?'':' data-act="cell" data-key="'+sk+'"';
			if (sk===null) {
				cls = 'noplay';
			} else if (sk in game.field) {
				const f = game.field[sk];
				const opened = (f['isOpen']===true);
				//if (field[sk]['isOpen']==true) vd = '.'; //vd += '.'
				if (f['bombCount']!==undefined) {
					vd = f['bombCount']>0?f['bombCount']:'';
					cls = 'color'+f['bombCount'];
				}
				if (game.inGame===2 && opened===false && f['hasBomb']===true && f['hasMark']!==true) { vd = '&#128165;'; cls = 'bomb'; } //game over: the mines that are still closed get revealed
				if (f['hasMark']==true && opened===false) {
					if (game.inGame===2 && f['hasBomb']===false) { vd = '&#10060;'; cls = 'markbad'; } //game over: a wrong flag is struck out
					else { vd = '&#9873;'; cls = 'mark'; }  //M  &#127987   &#128681 &#9873;  (a correct flag stays a flag)
				}
				if (f['hasBomb']==true && opened===true) { vd = '&#128165;'; cls = 'bomb'; }; //*  &#128163; &#128165;
			}
			s += '<td class="cell '+cls+'"'+act+'>&nbsp;'+vd+'&nbsp;</td>';
		}	
		s += '</tr>';
	}
	s += '</table>';
	return s;
}

function buildControls() {
	let s = '<table class="move">' + 
			'<tr>' +
				'<td class="find" title="Find/Center" data-act="find">&#128270;</td>' +  //  &#10687;  &#128270;
				'<td class="moveView moveUp" title="Move up" data-act="move" data-dir="U">&#x21e7;</td>' +  //U
				'<td class="restart" title="Restart" data-act="restart">&#x21bb;</td>' +
			'</tr>' +
			'<tr>' +
				'<td class="moveView moveLeft" title="Move left" data-act="move" data-dir="L">&#x21e6;</td>' +  //L
				'<td>'+buildView()+'</td>' +
				'<td class="moveView moveRight" title="Move right" data-act="move" data-dir="R">&#x21e8;</td>' +  //R
			'</tr>' +
			'<tr>' +
				'<td class="marker marker-'+(ui.markOnClick===true?'on':'off')+'" title="Toggle open/mark" data-act="marker">&#9873;</td>' +
				'<td class="moveView moveDown" title="Move down" data-act="move" data-dir="D">&#x21e9;</td>' +  //D
				'<td class="conf" title="Configuration" data-act="conf">&#9776;</td>' +
			'</tr>' +
		'</table>'; 

	return s;
}

function buildInfo() {
	let s = '<div>Mines</div>';
	let gk = getGameKey();
	let cg = parseGameKey(gk);
	let fg = favoriteGames();
	s += `<div>${templateItemGame(cg[0], cg[1], null, gk, (fg!=null && fg!==undefined && fg.indexOf(gk)>-1))}</div>`;
	if (game.inGame===2) {
		const r = getResult();
		s += `<div>END --- Score: ${r['score']} (Bombs: ${r['bombs']}, Marks: ${r['marks']}, Time: ${formatTime(r['time'])})`
			+ (newBest.score?' &#9733; NEW BEST SCORE!':'')  //&#9733;
			+ (newBest.time?' &#9733; NEW BEST TIME!':'') + `</div>`;  //&#9733;
	} else {
		s += `<div>${((allCellKeys().length>0)?'Running ...':'Click to start')}</div>`;
	}
	s += `<div>Lives left: ${((game.defaultLives>0)?((game.lives>=0)?game.lives:''):'&infin;')}</div>`;
	s += `<div>Time: <span id="gameTime">${formatTime(getElapsed())}</span>`
		+ ((game.timeStarted===true && game.inGame!==2)?` <button class="pausebtn" data-act="pause" title="${(game.timePaused===true)?'Resume':'Pause'}">${(game.timePaused===true)?'&#9654;':'&#9208;'}</button>`:'')
		+ ((game.timePaused===true)?' (paused)':'') + `</div>`;
	s += `<div>Clicks: ${game.clickCount}</div>`;
	return s;
}

function templateItemGame(gName, gKey, gProps, gValue, isFav) {
	let s = gName; 
	if (gKey!==null && gKey!==undefined) {
		s += ` <input type="button" name="newgame${gKey}" title="New game" value="New game" data-act="newgame" data-key="${(gProps!==null && gProps!==undefined)?gProps:gKey}">`; 
	}
	if (isFav!==null && isFav!==undefined) {
		let ft = isFav?"Remove from Favorites":"Add to Favorites";
		s += ` <input type="button" name="favtoggle${gKey}" title="${ft}" value="${ft}" data-act="fav" data-key="${gValue}">`; 
	}
	
	return s;
}

function buildConfig() {

function updateView() {
	//pure render: reads the model, never modifies it (end condition is checked by the action handlers)
	const el = document.getElementById('infimine');
	
	let s = '';
	for (let b of [buildInfo, buildControls, buildConfig]) {
		s += b();
	}
	
	el.innerHTML = s;
}

function checkEndCondition() {
	if (game.inGame==2) return true;
	const openBomb = countWhere(cellIsOpenBomb);
	game.lives = game.defaultLives - openBomb;
	game.lives = game.lives>0?game.lives:0;
	if (game.defaultLives>0 && game.lives<=0) { 
		game.inGame = 2; 
		timerFreeze(); //lock the final time
		//a lost game records NO best score - only a finished (won) game counts
	} else {
		const leftOpen = countWhere(cellIsOpenable);
		if (allCellKeys().length>0 && leftOpen<=0) {
			game.inGame = 2;
			timerFreeze(); //lock the final time before the score reads it
			setBestScoreList(); //only the win is written to the best score list
		}
	}
	return (game.inGame==2);
}

function clickCell(ev,el) {
	if (game.inGame===2) return; //finished ...
	if (game.timePaused===true) { timerToggle(); return; } //a click in the field ends the pause - it does not act on the cell itself
	timerStart(); //the clock starts with the first interaction in the field
	if ((ev.type=='click' && ev.ctrlKey) || (ev.type=='contextmenu') || (ui.markOnClick===true)) {
		changeMarkCell(el.dataset.key);
	} else {
		openCell(el.dataset.key);
	}
	
	game.clickCount += 1;

	checkEndCondition(); //evaluate the game state after the action, before rendering
	updateView();
	save(); //auto-save: closing the tab keeps the progress
}

function newGame(gd) {
	let s = gd.split('_').map(Number);
	if (s.length==4 && s[3]>0) {
		let props = {spaceSize: [s[0],s[1]], viewCenter: [-1,-1]};
		if (s[0]!=0 && s[1]!=0 && s[3]>1) {
			props['fixedBombs'] = parseInt(s[3]);
		} else {
			props['bombDensity'] = s[3];
		}
		if (parseInt(s[2])>0) {
			props['defaultLives'] = s[2];
		}
		main(props);
	}
}

function myNewGame() {
	const hi = document.getElementById('ngSpaceHi').checked;
	const wi = document.getElementById('ngSpaceWi').checked;
	let h = 0, w = 0; //infinity
	if (!hi) {
		h = parseInt(document.getElementById('ngSpaceH').value);
		h = isNaN(h)?0:h;
		if (h<=0) { return showMessage('Space Height: must be > 1');} 
		const hc = document.getElementById('ngSpaceHc').checked;
		if (hc) h = -h;
	}
	if (!wi) {
		w = parseInt(document.getElementById('ngSpaceW').value);
		w = isNaN(w)?0:w;
		if (w<=0) { return showMessage('Space Width: must be > 1'); }
		const wc = document.getElementById('ngSpaceWc').checked;
		if (wc) w = -w;
	}
	
		
	let l = parseInt(document.getElementById('ngLives').value);
	l = isNaN(l)?0:l;
	if (l<0 || l>5) { return showMessage('Lives: must be in range 0-5 (0=infinity)'); }
	let bd = parseFloat(document.getElementById('ngBombDensity').value)/100.0; //%
	bd = (isNaN(bd)?0:bd).toFixed(4);
	let b = 0;
	if (h!=0 && w!=0) {
		b = parseInt(document.getElementById('ngBombs').value);
		b = isNaN(b)?0:b;
		if (b<=0 && bd==0) { return showMessage('Bombs: must be > 0'); }
	}

	const gd = h+'_'+w+'_'+l+'_'+(b>0?b:bd);
	newGame(gd);
}

/* --- event delegation: one listener per event type on the root element --- */
function onRootClick(ev) {
	const el = ev.target.closest('[data-act]');
	if (el===null) return;
	switch (el.dataset.act) {
		case 'cell': clickCell(ev, el); break;
		case 'find': findCellCenterView(); break;
		case 'move': moveViewBy(el.dataset.dir); break;
		case 'restart': restart(); break;
		case 'marker': toggleMarker(); break;
		case 'pause': timerToggle(); break;
		case 'conf': toggleConfig(); break;
		case 'newgame': newGame(el.dataset.key); break;
		case 'fav': toggleFavoriteGame(el.dataset.key); break;
		case 'conftab': openConfTab(el.dataset.tab, el); break;
		case 'mynewgame': myNewGame(); break;
		case 'save': save(); break;
		case 'load': load(); break;
		case 'savedisk': saveToDisk(); break;
		case 'loaddisk': loadFromDisk(); break;
		case 'exportstorage': exportStorageData(); break;
		case 'importstorage': importStorageData(); break;
		case 'resetscore': resetBestScoreList(); break;
		case 'viewsize': changeViewSize(); break;
		case 'changedim': changeDim(parseInt(el.dataset.dim)); break;
		case 'moveindim': moveInDim(parseInt(el.dataset.dim)); break;
	}
}

function onRootContextMenu(ev) {
	ev.preventDefault(); //no browser menu inside the game
	const el = ev.target.closest('[data-act="cell"]');
	if (el!==null) clickCell(ev, el);
}

function onRootMouseMove(ev) {
	if (!ev.ctrlKey) return;
	const el = ev.target.closest('[data-act="move"]');
	if (el!==null) moveViewBy(el.dataset.dir);
}

function onVisibilityChange() {
	//auto-pause when the tab is hidden - the clock measures play, not idle time;
	//coming back does not resume by itself, a click in the field (or the button) does
	if (document.hidden===true && timerRunning()===true) timerToggle();
}

function installEventListeners() {
	const root = document.getElementById('infimine');
	root.addEventListener('click', onRootClick);
	root.addEventListener('contextmenu', onRootContextMenu);
	root.addEventListener('mousemove', onRootMouseMove);
	window.addEventListener('keydown', onKeyDownEvent);
	document.addEventListener('visibilitychange', onVisibilityChange);
	startTicker(); //keep the visible time fresh between renders
}

function onKeyDownEvent(ev) {
	if (ev.target instanceof Element && ev.target.closest('input,textarea,select')) return; //let arrows drive form fields
	if (ev.key.substr(0,5)==="Arrow") { 
		moveViewBy(ev.key.substr(5,1));
	}
}

function moveViewBy(dir) {
	let delta = [0,0];
	if (dir==='U') { 
		delta = [-1,0];
	} else if (dir==='R') {
		delta = [0,1];
	} else if (dir==='D') {
		delta = [1,0];
	} else if (dir==='L') {
		delta = [0,-1];
	} else {
		return; //no change
	}
	
	game.viewCenter = [game.viewCenter[0]+delta[0], game.viewCenter[1]+delta[1]];
	updateView();
}

function changeViewSize(newH, newW) {
	let h = newH===undefined?parseInt(document.getElementById('viewH').value):parseInt(newH);
	let w = newW===undefined?parseInt(document.getElementById('viewW').value):parseInt(newW);
	h = isNaN(h)?0:h;
	w = isNaN(w)?0:w;
	if (h>0 && h<=99 && w>0 && w<=99) {
		game.viewSize = [h,w];
		updateView();
	} else {
		showMessage('must be between 1-99')
	}
}

function toggleMarker() {
	ui.markOnClick = !ui.markOnClick;
	updateView();
}

function toggleConfig() {
	ui.showConf = !ui.showConf;
	updateView();
	
	const t = document.getElementById("defaultConfTab");
	if (t!=null) { t.click(); }
}

/* storage layer - all localStorage access goes through these helpers
   (keys are constants, JSON parsing never throws, values are validated) */
function storageGet(key) {
	try { return window.localStorage.getItem(key); } catch(e) { return null; }
}

function storageSet(key, value) {
	try { window.localStorage.setItem(key, value); } catch(e) { /* quota / private mode */ }
}

function storageRemove(key) {
	try { window.localStorage.removeItem(key); } catch(e) { /* ignore */ }
}

function storageKeys() {
	try { return Object.keys(window.localStorage); } catch(e) { return []; }
}

function parseJSONSafe(s, fallback) {
	if (!s) return fallback;
	try {
		const v = JSON.parse(s);
		return (v===undefined || v===null) ? fallback : v;
	} catch(e) { return fallback; }
}

function isManagedStorageKey(k) {
	//the keys this game owns - export/import must never touch anything else in the shared origin storage
	return (k===STORAGE_KEY_GAME || k===STORAGE_KEY_LAST_GAME
		|| k===STORAGE_KEY_FAVORITES || k.startsWith(STORAGE_KEY_BEST_SCORE_PREFIX));
}

function managedStorageKeys() {
	return storageKeys().filter(isManagedStorageKey);
}

function isValidGame(d) {
	return (d!==null && typeof d==='object' && !Array.isArray(d)
		&& d['field']!==null && typeof d['field']==='object' && !Array.isArray(d['field'])
		&& Array.isArray(d['spaceSize']));
}

function getGameKey() {
	return JSON.stringify([game.spaceSize, game.defaultLives, game.fixedBombs>0?game.fixedBombs:game.bombDensity]);
}

function parseGameKey(k) {
	const p = parseJSONSafe(k, null);
	if (!Array.isArray(p) || !Array.isArray(p[0])) return ['Unknown game', ''];
	let s = 'Space Size: ' + ((p[0][0]!=0)?(Math.abs(p[0][0]) + (p[0][0]<0?('(cyklic)'):'')):'infinite') + '/' + ((p[0][1]!=0)?(Math.abs(p[0][1]) + (p[0][1]<0?('(cyklic)'):'')):'infinite');
	s += ', Lives: ' + (p[1]>0?p[1]:'infinite');
	if (parseFloat(p[2])>1) {
		s += ', Bombs: ' + parseInt(p[2]);
	} else {
		s += ', Bomb Density: ' + (100*parseFloat(p[2])).toFixed(2) + '%';
	}
	const ng = parseInt(p[0][0]) + '_' + parseInt(p[0][1]) + '_' + (parseInt(p[1])>0?p[1]:'') + '_' + ((parseFloat(p[2])>0)?p[2]:'');
	
	return [s,ng]
	
}

function compareScoreEntries(x, y) {
	const sx = parseInt(x[0]);
	const sy = parseInt(y[0]);
	if (sx !== sy) return sx - sy; //lower score is better - the best one comes first
	return (new Date(x[2])) - (new Date(y[2])); //older date first on ties
}

function getBestScoreList(k) {
	let s = storageGet(STORAGE_KEY_BEST_SCORE_PREFIX + k);
	let scoreList = parseJSONSafe(s, []);
	if (!Array.isArray(scoreList)) return [];
	return scoreList.sort(compareScoreEntries); //lists stored by older versions may still be in the wrong order
}

function setBestScoreList() {
	let k = getGameKey();
	let scoreList = getBestScoreList(k);

	let newScore = getResult();
	if (game.inGame===2 && newScore) {
		//compare with the current records BEFORE the new entry is written (the badges show in the END line)
		newBest.score = (scoreList.length===0) || (parseInt(newScore['score']) < parseInt(scoreList[0][0])); //lower score is better
		const times = scoreList.filter(e => e[1] && typeof e[1]['time']==='number').map(e => e[1]['time']);
		newBest.time = (typeof newScore['time']==='number' && newScore['time']>0) &&
			(times.length===0 || newScore['time'] < Math.min.apply(null, times)); //faster time is better
		scoreList.push([newScore['score'], newScore, new Date()]);
		scoreList.sort(compareScoreEntries);
		scoreList = scoreList.slice(0,5);  //only the 5 best (i.e. lowest) scores are kept
		storageSet(STORAGE_KEY_BEST_SCORE_PREFIX + k, JSON.stringify(scoreList));
	}
}

function resetBestScoreList() {
	let k = getGameKey();
	storageRemove(STORAGE_KEY_BEST_SCORE_PREFIX + k);
}

function bestScoreListGames() {
	const gmsl = storageKeys()
		.filter(x => x.startsWith(STORAGE_KEY_BEST_SCORE_PREFIX))
		.map(function (x) {
			let k = x.substring(STORAGE_KEY_BEST_SCORE_PREFIX.length);
			const gk = parseGameKey(k);
			return {
				key: k,
				name: gk[0],
				props: gk[1]
			}
	});
	
	return gmsl;
}

function toggleFavoriteGame(gk) {
	let cfg = favoriteGames();
	const idx = cfg.indexOf(gk);
	if (idx>-1) {
		//remove
		cfg.splice(idx, 1);
	} else {
		//add
		cfg.push(gk);
		cfg.sort();
	}
	storageSet(STORAGE_KEY_FAVORITES, JSON.stringify(cfg));
	updateView();
}

function favoriteGames() {
	let fg = parseJSONSafe(storageGet(STORAGE_KEY_FAVORITES), []);
	return Array.isArray(fg) ? fg : [];
}

function quickStartGames() {
	//default
	return ['[[8,8],3,10]', '[[16,16],3,40]', '[[16,30],3,99]', '', '[[-8,-8],3,10]', '[[-16,-16],3,40]', '[[-16,-30],3,99]'];
}

function serializeGame() {
	timerFold(); //the running segment must be materialized into timeElapsed before writing
	return JSON.stringify(Object.assign({}, game, ui));
}

function save() {
	//ui state is merged in so the save keeps the legacy key shape
	storageSet(STORAGE_KEY_GAME, serializeGame());
}

function load() { //returns true when a saved game was loaded
	let g = storageGet(STORAGE_KEY_GAME);
	let d = parseJSONSafe(g, null);
	if (!isValidGame(d)) {
		if (g) showMessage('Saved game is corrupted - not loaded');
		return false;
	}
	//legacy saves carry the ui keys inside the game object
	if (d['showConf']!==undefined) { ui.showConf = d['showConf']===true; delete d['showConf']; }
	if (d['markOnClick']!==undefined) { ui.markOnClick = d['markOnClick']===true; delete d['markOnClick']; }
	game = d;
	timerNormalize(); //before the end check, so a game ending here reads a sane time
	checkEndCondition(); //a loaded game may already be over
	updateView();
	return true;
}

function downloadText(filename, text) {
	const contentType = 'application/json';
	const content = new Blob([text], {type: contentType});
	if (window.navigator.msSaveOrOpenBlob) // IE10+
		window.navigator.msSaveOrOpenBlob(content, filename);
	else { // Others
		let a = document.createElement("a"), url = URL.createObjectURL(content);
		a.href = url;
		a.download = filename;
		document.body.appendChild(a);
		a.click();
		setTimeout(function() {
			document.body.removeChild(a);
			window.URL.revokeObjectURL(url);  
		}, 0); 
	}
}

function saveToDisk() {
	downloadText('infimine.save', serializeGame());
}

function exportStorageData() {
	//backup of everything the game keeps: scores, favorites, last game, the saved game
	const data = {};
	for (let k of managedStorageKeys()) {
		const v = storageGet(k);
		if (v!==null) data[k] = v;
	}
	downloadText('infimine.storage', JSON.stringify({format:'infimine-storage', version:1, exportedAt:new Date().toISOString(), data:data}));
}

function importStorageData() {
	const files = document.getElementById('importStorageFile').files;
	if (files.length <= 0) return false;
	const fr = new FileReader();
	fr.onload = function(e) {
		if (!e.target.result) return;
		try {
			const d = parseJSONSafe(e.target.result, null);
			if (!d || typeof d['data']!=='object' || d['data']===null || Array.isArray(d['data'])) { throw new Error('not a storage file'); }
			let n = 0;
			for (let k of Object.keys(d['data'])) {
				//only keys the game owns are imported, and only as strings (checked by name - the local storage may be empty)
				if (!isManagedStorageKey(k) || typeof d['data'][k]!=='string') continue;
				storageSet(k, d['data'][k]);
				n += 1;
			}
			if (n<=0) { throw new Error('nothing importable'); }
			showMessage('Imported '+n+' entries');
			updateView(); //scores/favorites show up right away; the game itself is restored by Load
		} catch(er) {
			showMessage('Import failed - not a storage file');
		}
	}
	fr.readAsText(files.item(0));
}

function loadFromDisk() {
	const files = document.getElementById('loadDiskFile').files;
	if (files.length <= 0) return false;
	const fr = new FileReader();
	fr.onload = function(e) { 
		if (e.target.result) {
			try {
				
				const d = parseJSONSafe(e.target.result, null);
				if (!isValidGame(d)) { throw new Error('invalid game'); }
				mainProps = {};
				for (let k of ['bombDensity', 'canOpenNeighbours', 'defaultLives', 'spaceSize', 'fixedBombs', 'viewSize', 'viewCenter']) {
					if (d[k]!==undefined) { mainProps[k] = d[k]; }
				}
				game  = initDefinition();
				const gv = initValues();
				game = Object.assign({}, game, gv);

				for (let k of ['field', 'viewDim', 'currDimCoord', 'inGame', 'lives', 'clickCount', 'timeElapsed', 'timePaused', 'timeStarted']) {
					//timeRunningSince is not copied on purpose - timerNormalize restarts the segment now (3a)
					if (d[k]!==undefined) { game[k] = d[k]; }
				}
				ui.showConf = (d['showConf']===true); //ui keys of a legacy save go to the ui state
				ui.markOnClick = (d['markOnClick']===true);
				
				timerNormalize();
				checkEndCondition(); //a loaded game may already be over
				updateView();	
			
			} catch(er) {
				showMessage('Error')
			}
		}
	}
	fr.readAsText(files.item(0));
}

function openConfTab(tabName, btn) {
	const tabcontent = document.getElementsByClassName("conftabcontent");
	for (let i = 0; i < tabcontent.length; i++) {
		tabcontent[i].style.display = "none";
	}

	const tablinks = document.getElementsByClassName("conftablinks");
	for (let i = 0; i < tablinks.length; i++) {
		tablinks[i].className = tablinks[i].className.replace(" active", "");
	}

	document.getElementById(tabName).style.display = "block";
	btn.className += " active";
}

function main(props) {
	if (!props) {
		//auto-restore the saved game - a reload lands exactly where the tab was closed;
		//an already finished game does not count, a fresh one is started below
		if (load()===true && game.inGame!==2) return;
		let lg = storageGet(STORAGE_KEY_LAST_GAME);
		if (lg && lg.split('_').map(Number).length==4) {
			newGame(lg);
			return
		} else {
			props = {};
		}
	}
	mainProps = props;
	game  = initDefinition();
	restart();
}

function restart() {
	ui.showConf = false; //a fresh game starts with a clean UI state (as initValues did before)
	ui.markOnClick = false;
	newBest = { score: false, time: false }; //no badges until the new game ends
	const gv = initValues();
	game = Object.assign({}, game, gv);
	updateView();	

	storageSet(STORAGE_KEY_LAST_GAME, parseGameKey(getGameKey())[1]);
	save(); //auto-save the fresh game too - a reload restores what is on screen
}

function showMessage(m) {
	console.log(m);
	const old = document.getElementById('infimine-message');
	if (old) { old.remove(); }
	const el = document.createElement('div');
	el.id = 'infimine-message';
	el.className = 'message';
	el.textContent = m;
	document.body.appendChild(el);
	setTimeout(function() { el.remove(); }, 4000);
}

//test
function getField() {
	return game.field;
}

const infimine = {
	main: main,
	restart: restart,
	save: save,
	load: load,
	saveToDisk: saveToDisk,
	loadFromDisk: loadFromDisk,
	moveViewBy: moveViewBy,
	toggleConfig: toggleConfig,
	toggleMarker: toggleMarker,
	findCellCenterView: findCellCenterView,
	changeViewSize: changeViewSize,
	changeDim: changeDim,
	moveInDim: moveInDim,
	clickCell: clickCell,
	newGame: newGame,
	myNewGame: myNewGame,
	resetBestScoreList: resetBestScoreList,
	toggleFavoriteGame: toggleFavoriteGame,
	
	openConfTab: openConfTab,
	onRootClick: onRootClick,
	onRootContextMenu: onRootContextMenu,
	setRandom: setRandom,
	getElapsed: getElapsed,
	timerToggle: timerToggle,
	formatTime: formatTime,
	onVisibilityChange: onVisibilityChange
	
	//,field: getField
};

window.infimine = infimine;

installEventListeners();
infimine.main();

</script>
